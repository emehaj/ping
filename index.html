<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <img src="images/logo.svg" alt="logo">
    </header>

    <main>
        <div class="soon">
            <h1>We are launching <span>soon!</span></h1>
            <p>Subscribe and get notified</p>
            <form action="#" method="post">
                <input type="email" name="email" id="email" placeholder="Your email address...">
                <button type="button">Notify Me</button>
            </form>
        </div>

        <img src="images/illustration-dashboard.png" alt="illustration">
    </main>

    <footer>
        <div class="socials">
            <div class="app"><img src="images/facebook.svg" alt="facebook logo"></div>
            <div class="app"><img src="images/twitter.svg" alt="twitter logo"></div>
            <div class="app"><img src="images/instagram.svg" alt="instagram logo"></div>
        </div>
        <p>&copy; Copyright Ping. All rights reserve.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
